name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Tests blickli-core on GitHub-hosted macOS runners.
  # The full `blickli` app crate requires the macOS 27 SDK for Core AI.
  core-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p blickli-core
